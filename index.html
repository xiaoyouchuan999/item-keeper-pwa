<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#302b28"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon.svg"><title>物品管家</title><style>
:root{--ink:#302b28;--muted:#8f847d;--cream:#f7f1e8;--paper:#fffdf9;--line:#e9dfd3;--red:#c96556;--sage:#829778;--amber:#d6a14b}*{box-sizing:border-box}body{margin:0;background:#e9e3dc;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}.app{width:min(100%,720px);min-height:100vh;margin:auto;background:var(--cream);padding:24px 20px 105px}.top{display:flex;justify-content:space-between;align-items:center}.eyebrow{margin:0;color:#a28e7d;font-size:10px;letter-spacing:.2em}.top h1,.heading h2{font-family:Georgia,"Songti SC",serif;margin:4px 0 0}.round{width:44px;height:44px;border:0;border-radius:50%;background:var(--ink);color:#fff;font-size:25px}.hero{margin-top:22px;padding:27px;border-radius:29px;color:#fffaf4;background:linear-gradient(135deg,#60564f,#302b28);display:flex;justify-content:space-between;align-items:end;min-height:185px}.hero small{color:#d9ccc1}.hero h2{font:600 24px/1.45 Georgia,"Songti SC",serif}.total{text-align:right}.total b{display:block;font:52px Georgia}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0 28px}.stats button{border:1px solid var(--line);border-radius:19px;background:var(--paper);padding:15px;text-align:left}.stats b,.stats small{display:block}.stats b{font:25px Georgia}.stats small{color:var(--muted);margin-top:3px}.heading{display:flex;justify-content:space-between;align-items:end;margin:18px 0 12px}.heading h2{font-size:22px}.heading button{border:0;background:none;color:#a06453}.alerts,.card,.setting{background:var(--paper);border:1px solid var(--line);border-radius:22px}.alert{width:100%;display:flex;gap:12px;align-items:center;padding:15px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}.alert:last-child{border:0}.alert>span{width:40px;height:40px;display:grid;place-items:center;background:#f1e9df;border-radius:13px}.alert div{flex:1}.alert b,.alert small{display:block}.alert small{color:#ad6552;margin-top:4px}.quick{margin-top:16px;padding:19px;border-radius:21px;background:#e8dac9;display:flex;justify-content:space-between;align-items:center}.quick p{margin:4px 0;color:#8d7a6c;font-size:11px}.quick button,.primary{border:0;border-radius:13px;background:var(--ink);color:#fff;padding:12px 15px}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--paper)}.chips{display:flex;gap:7px;overflow:auto;margin:12px -20px;padding:0 20px 8px}.chips button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 12px;color:var(--muted)}.chips .on{background:var(--ink);color:#fff}.list{display:grid;gap:10px}.card{display:flex;gap:13px;padding:15px}.icon{width:48px;height:48px;flex:none;display:grid;place-items:center;border-radius:15px;background:#f0e8de;font-size:22px}.cardmain{flex:1;min-width:0}.row{display:flex;justify-content:space-between;gap:8px}.row h3{margin:0}.row p{margin:4px 0;color:var(--muted);font-size:10px}.tag{height:21px;border-radius:99px;padding:4px 8px;background:#f3dfd8;color:#a44e42;font-size:9px}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:10px}.qty{display:flex;gap:7px;align-items:center}.qty button{width:25px;height:25px;border:1px solid var(--line);border-radius:8px;background:#f7f1ea}.actions{text-align:right}.actions button{border:0;background:none;color:#9c8c81;font-size:10px}.setting{padding:18px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center}.setting p{margin:4px 0;color:var(--muted);font-size:10px}.backup{display:grid;gap:9px;text-align:center;padding:24px}.backup p{color:var(--muted);font-size:11px;line-height:1.6}.secondary{border:1px solid var(--line);background:#f7f1ea;border-radius:13px;padding:12px}.secondary input{display:none}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,720px);height:80px;display:grid;grid-template-columns:repeat(4,1fr);background:#fffdf9ef;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{border:0;background:none;color:#9f958e}.nav .on{color:var(--ink);font-weight:700}.modal{position:fixed;inset:0;z-index:30;background:#302b2880;display:none;align-items:end;justify-content:center}.modal.on{display:flex}.form{width:min(100%,720px);max-height:94vh;overflow:auto;background:var(--cream);border-radius:28px 28px 0 0;padding:23px}.formhead{display:flex;justify-content:space-between}.formhead button{border:0;background:#e8ddd2;border-radius:50%;width:35px;height:35px}.form label{display:grid;gap:6px;margin-top:12px;color:#776b63;font-size:11px}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.switch{display:flex!important;justify-content:space-between;align-items:center;background:#ece2d6;padding:12px;border-radius:14px}.switch input{width:auto}.submit{width:100%;margin-top:17px}.empty{text-align:center;padding:36px;color:var(--muted)}.hide{display:none!important}.toast{position:fixed;z-index:50;bottom:95px;left:50%;transform:translateX(-50%);background:#302b28;color:#fff;border-radius:99px;padding:10px 16px;display:none}@media(min-width:760px){.app{padding:36px 42px 110px}.list{grid-template-columns:1fr 1fr}.modal{align-items:center}.form{border-radius:28px}}
</style></head><body><main class="app"><header class="top"><div><p class="eyebrow">MY HOME INVENTORY</p><h1>物品管家</h1></div><button class="round add">＋</button></header><section id="home"></section><section id="items" class="hide"></section><section id="settings" class="hide"></section><nav class="nav"><button data-view="home" class="on">⌂<br>首页</button><button data-view="items">▦<br>物品</button><button class="add">＋<br>添加</button><button data-view="settings">⚙<br>设置</button></nav></main>
<div class="modal"><form class="form"><div class="formhead"><div><p class="eyebrow">NEW ITEM</p><h2>添加物品</h2></div><button type="button" class="close">×</button></div><input type="hidden" name="id"><label>物品名称 *<input name="name" required placeholder="例如：低温牛奶"></label><div class="grid"><label>分类<select name="category"></select></label><label>存放位置<input name="location" placeholder="冰箱 / 储物柜"></label><label>当前数量<input name="quantity" type="number" min="0" value="1"></label><label>单位<input name="unit" value="件"></label><label>低于此数提醒<input name="min" type="number" min="0" value="1"></label></div><label class="switch"><span>此物品无需保质期</span><input name="noExpiry" type="checkbox"></label><div class="grid dates"><label>生产日期<input name="production" type="date"></label><label>保质期（天）<input name="shelfDays" type="number" min="1" placeholder="自动计算到期日"></label><label>过期时间<input name="expiry" type="date"></label></div><label>备注<textarea name="note" placeholder="规格、开封日期或其他提醒…"></textarea></label><button class="primary submit">保存物品</button></form></div><div class="toast"></div>
<script>
const DEFAULT_CATEGORIES=['食品','药品','护肤美妆','清洁用品','宠物用品','日常用品','其他'],E={食品:'🥫',药品:'💊',护肤美妆:'🧴',清洁用品:'🫧',宠物用品:'🐾',日常用品:'🧺',其他:'📦'},KEY='item-keeper-items',CATEGORY_KEY='item-keeper-categories';let notice=+(localStorage.noticeDays||7),items=JSON.parse(localStorage.getItem(KEY)||'null')||[{id:'1',name:'低温牛奶',category:'食品',location:'冰箱冷藏',quantity:1,unit:'瓶',min:2,production:'',shelfDays:'',expiry:new Date(Date.now()+172800000).toISOString().slice(0,10),noExpiry:false,note:''},{id:'2',name:'厨房纸巾',category:'日常用品',location:'储物间',quantity:2,unit:'卷',min:3,production:'',shelfDays:'',expiry:'',noExpiry:true,note:''}],categories=JSON.parse(localStorage.getItem(CATEGORY_KEY)||'null')||[...DEFAULT_CATEGORIES];items.forEach(i=>{if(i.category&&!categories.includes(i.category))categories.push(i.category)});let filter='全部';
const save=()=>{localStorage.setItem(KEY,JSON.stringify(items));localStorage.setItem(CATEGORY_KEY,JSON.stringify(categories))},emoji=c=>E[c]||'📦',days=d=>Math.ceil((new Date(d)-new Date(new Date().toISOString().slice(0,10)))/86400000),state=i=>!i.noExpiry&&i.expiry&&days(i.expiry)<0?'expired':i.quantity<=i.min?'low':!i.noExpiry&&i.expiry&&days(i.expiry)<=notice?'soon':'ok',label=i=>state(i)=='expired'?'已过期':state(i)=='low'?'待补货':state(i)=='soon'?'临期':'正常',toast=t=>{let x=document.querySelector('.toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)};
function render(){let bad=items.filter(i=>state(i)!='ok'),ex=items.filter(i=>state(i)=='expired').length,soon=items.filter(i=>state(i)=='soon').length,low=items.filter(i=>i.quantity<=i.min).length;if(filter!='全部'&&!categories.includes(filter))filter='全部';home.innerHTML='<div class="hero"><div><small>今日整理</small><h2>家里的每一件东西，<br>都心里有数。</h2></div><div class="total"><b>'+items.length+'</b><small>种物品</small></div></div><div class="stats"><button><b>'+ex+'</b><small>已过期</small></button><button><b>'+soon+'</b><small>即将到期</small></button><button><b>'+low+'</b><small>待补货</small></button></div><div class="heading"><div><p class="eyebrow">REMINDERS</p><h2>需要关注</h2></div></div><div class="alerts">'+(bad.length?bad.slice(0,5).map(i=>'<button class="alert edit" data-id="'+i.id+'"><span>'+emoji(i.category)+'</span><div><b>'+i.name+'</b><small>'+label(i)+(i.expiry?' · '+i.expiry:'')+'</small></div>›</button>').join(''):'<div class="empty">✨<br>一切井井有条</div>')+'</div><div class="quick"><div><b>刚买了新东西？</b><p>随手记下，之后就不怕忘记。</p></div><button class="add">添加物品</button></div>';
itemsEl.innerHTML='<div class="heading"><div><p class="eyebrow">INVENTORY</p><h2>全部物品</h2></div></div><input class="search" placeholder="搜索物品、位置或备注"><div class="chips">'+['全部',...categories].map(c=>'<button data-filter="'+c+'" class="'+(filter==c?'on':'')+'">'+c+'</button>').join('')+'</div><div class="list">'+items.filter(i=>filter=='全部'||i.category==filter).map(i=>'<article class="card"><div class="icon">'+emoji(i.category)+'</div><div class="cardmain"><div class="row"><div><h3>'+i.name+'</h3><p>'+i.category+(i.location?' · '+i.location:'')+'</p></div>'+(state(i)!='ok'?'<span class="tag">'+label(i)+'</span>':'')+'</div><div class="meta"><span class="qty"><button data-d="-1" data-id="'+i.id+'">−</button><b>'+i.quantity+'</b>'+i.unit+'<button data-d="1" data-id="'+i.id+'">＋</button></span><span>'+(i.noExpiry?'无保质期':i.expiry||'未填写日期')+'</span></div><div class="actions"><button class="edit" data-id="'+i.id+'">编辑</button><button class="del" data-id="'+i.id+'">删除</button></div></div></article>').join('')+'</div>';
settings.innerHTML='<div class="heading"><div><p class="eyebrow">SETTINGS & BACKUP</p><h2>设置与数据</h2></div></div><div class="setting"><div><b>分类管理</b><p>新增、重命名或删除自己的分类</p><div class="category-list">'+categories.map((c,n)=>'<div><span>'+emoji(c)+' '+c+'</span> <button class="renameCategory" data-index="'+n+'">重命名</button> <button class="deleteCategory" data-index="'+n+'">删除</button></div>').join('')+'</div></div><button class="primary" id="addCategory">＋ 新增</button></div><div class="setting"><div><b>临期提醒时间</b><p>到期前多少天开始提醒</p></div><select id="notice">'+[3,7,14,30,60].map(n=>'<option '+(n==notice?'selected':'')+' value="'+n+'">提前 '+n+' 天</option>').join('')+'</select></div><div class="setting"><div><b>系统通知</b><p>允许后，每次打开工具会推送待处理事项</p></div><button class="secondary" id="notify">开启通知</button></div><div class="setting backup"><b>保护你的物品数据</b><p>数据保存在当前设备，建议定期导出备份。</p><button class="primary" id="export">导出数据备份</button><label class="secondary">导入并恢复<input id="import" type="file" accept=".json"></label></div>';bind()}
function bind(){document.querySelectorAll('.add').forEach(b=>b.onclick=()=>open());document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>open(items.find(i=>i.id==b.dataset.id)));document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{let i=items.find(i=>i.id==b.dataset.id);i.quantity=Math.max(0,i.quantity+(+b.dataset.d));save();render()});document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{if(confirm('确定删除这个物品吗？')){items=items.filter(i=>i.id!=b.dataset.id);save();render()}});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});let ac=document.querySelector('#addCategory');if(ac)ac.onclick=()=>{let name=(prompt('请输入新的分类名称')||'').trim();if(!name)return;if(categories.includes(name))return toast('这个分类已经存在');categories.push(name);save();render();toast('分类已新增')};document.querySelectorAll('.renameCategory').forEach(b=>b.onclick=()=>{let old=categories[+b.dataset.index],name=(prompt('重命名分类',old)||'').trim();if(!name||name==old)return;if(categories.includes(name))return toast('这个分类已经存在');categories[+b.dataset.index]=name;items.forEach(i=>{if(i.category==old)i.category=name});if(filter==old)filter=name;save();render();toast('分类已重命名')});document.querySelectorAll('.deleteCategory').forEach(b=>b.onclick=()=>{let name=categories[+b.dataset.index];if(items.some(i=>i.category==name))return toast('请先移动或删除该分类下的物品');if(categories.length==1)return toast('至少保留一个分类');if(confirm('确定删除“'+name+'”分类吗？')){categories.splice(+b.dataset.index,1);save();render();toast('分类已删除')}});let s=document.querySelector('.search');if(s)s.oninput=()=>document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',!c.textContent.includes(s.value)));let n=document.querySelector('#notice');if(n)n.onchange=()=>{notice=+n.value;localStorage.noticeDays=notice;render()};let nb=document.querySelector('#notify');if(nb)nb.onclick=async()=>{if(!('Notification'in window))return toast('当前浏览器不支持通知');let p=await Notification.requestPermission();if(p==='granted'){notify();toast('通知已开启')}else toast('未获得通知权限')};let x=document.querySelector('#export');if(x)x.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({schemaVersion:2,exportedAt:new Date().toISOString(),items,categories,notice},null,2)],{type:'application/json'}));a.download='物品管家备份.json';a.click()};let im=document.querySelector('#import');if(im)im.onchange=()=>{let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.items))throw Error();items=d.items;categories=Array.isArray(d.categories)&&d.categories.length?[...new Set(d.categories)]:[...DEFAULT_CATEGORIES];items.forEach(i=>{if(i.category&&!categories.includes(i.category))categories.push(i.category)});notice=d.notice||7;save();render();toast('恢复成功')}catch{toast('文件格式不正确')}};r.readAsText(im.files[0])}}
function notify(){if(!('Notification'in window)||Notification.permission!=='granted')return;let bad=items.filter(i=>state(i)!=='ok');if(!bad.length)return;let text=bad.slice(0,3).map(i=>i.name+'（'+label(i)+'）').join('、');new Notification('物品管家：'+bad.length+' 项需要关注',{body:text+(bad.length>3?' 等':'')})}
function open(i){let f=document.querySelector('.form');f.reset();f.category.innerHTML=categories.map(c=>'<option>'+c+'</option>').join('');f.id.value=i?.id||'';['name','category','location','quantity','unit','production','shelfDays','expiry','note'].forEach(k=>f[k].value=i?.[k]??(k=='quantity'?1:k=='unit'?'件':''));f.min.value=i?.min??1;f.noExpiry.checked=i?.noExpiry||false;document.querySelector('.dates').classList.toggle('hide',f.noExpiry.checked);document.querySelector('.modal').classList.add('on')}document.querySelector('.close').onclick=()=>document.querySelector('.modal').classList.remove('on');document.querySelector('.form').noExpiry.onchange=e=>document.querySelector('.dates').classList.toggle('hide',e.target.checked);document.querySelector('.form').onsubmit=e=>{e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f));o.quantity=+o.quantity;o.min=+o.min;o.shelfDays=o.shelfDays?+o.shelfDays:'';o.noExpiry=f.noExpiry.checked;if(!o.noExpiry&&o.production&&o.shelfDays&&!o.expiry){let d=new Date(o.production+'T00:00:00');d.setDate(d.getDate()+o.shelfDays);o.expiry=d.toISOString().slice(0,10)}if(o.noExpiry){o.production='';o.shelfDays='';o.expiry=''}o.id=o.id||crypto.randomUUID();items=f.id.value?items.map(i=>i.id==o.id?o:i):[o,...items];save();document.querySelector('.modal').classList.remove('on');render();toast('物品已保存')};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('main>section').forEach(s=>s.classList.add('hide'));document.querySelector('#'+b.dataset.view).classList.remove('hide');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});const itemsEl=document.querySelector('#items');save();render();setTimeout(notify,1200);
</script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
